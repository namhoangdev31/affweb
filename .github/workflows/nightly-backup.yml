name: Nightly database backup

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BACKUP_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: Create encrypted logical backup
        env:
          PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
        run: |
          backup_file="affweb-$(date -u +%Y%m%dT%H%M%SZ).dump"
          docker run --rm \
            --env PRODUCTION_DIRECT_URL \
            --env BACKUP_FILE="$backup_file" \
            --volume "$PWD:/backup" \
            postgres:17-alpine \
            sh -c 'pg_dump "$PRODUCTION_DIRECT_URL" --format=custom --no-owner --file="/backup/$BACKUP_FILE"'
          aws s3api put-object \
            --bucket "$BACKUP_BUCKET" \
            --key "postgres/$backup_file" \
            --body "$backup_file" \
            --server-side-encryption aws:kms \
            --object-lock-mode COMPLIANCE \
            --object-lock-retain-until-date "$(date -u -d '+90 days' +%Y-%m-%dT%H:%M:%SZ)"

name: Release production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Immutable commit SHA already verified on staging
        required: true

permissions:
  contents: read

concurrency:
  group: affweb-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify immutable SHA
        run: test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
      - run: pnpm dlx vercel@56.5.0 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: pnpm dlx vercel@56.5.0 env pull .env.production.local --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Validate production environment
        run: pnpm exec tsx --env-file=.env.production.local scripts/check-env.ts
        env:
          NODE_ENV: production
      - name: Apply expand-contract migrations
        run: pnpm prisma migrate deploy
      - name: Verify migration state
        run: pnpm prisma migrate status
      - run: pnpm dlx vercel@56.5.0 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy immutable production artifact
        id: deploy
        run: |
          deployment_url="$(pnpm dlx vercel@56.5.0 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke test deployment
        run: pnpm smoke:production
        env:
          APP_BASE_URL: ${{ steps.deploy.outputs.url }}
